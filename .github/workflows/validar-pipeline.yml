name: Validar pipeline SIDRA

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validar-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes unitários
        run: python -m unittest discover -s tests -v

      - name: Diagnosticar acesso à API
        run: |
          python - <<'PY'
          import requests

          url_all = "https://apisidra.ibge.gov.br/values/t/6468/n6/2211001/v/4099/p/all/h/n/f/a/d/s"
          url_last = url_all.replace("/p/all/", "/p/last/")
          agente = {"User-Agent": "osert-data-pipeline/0.1 (+https://github.com/a-wilker/osert-data-pipeline)"}

          for nome, url, cabecalhos in (
              ("all-padrão", url_all, None),
              ("all-identificado", url_all, agente),
              ("last-padrão", url_last, None),
              ("last-identificado", url_last, agente),
          ):
              resposta = requests.get(url, headers=cabecalhos, timeout=30)
              print(f"{nome}: status={resposta.status_code}, bytes={len(resposta.content)}")
              if resposta.status_code != 200:
                  print(resposta.text[:300])
          PY

      - name: Validar consulta integrada ao SIDRA
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile

          from src.consulta_taxa_desocupacao import extrair_taxa_desocupacao

          with tempfile.TemporaryDirectory() as temporario:
              resultado = extrair_taxa_desocupacao(Path(temporario) / "raw")

          if resultado.empty:
              raise SystemExit("A API retornou uma série histórica vazia.")

          print(f"Quantidade de períodos: {len(resultado)}")
          print(f"Primeiro período retornado: {resultado.iloc[0]['Período']}")
          print(f"Último período retornado: {resultado.iloc[-1]['Período']}")
          PY
